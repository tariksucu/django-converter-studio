# The unit tests on every supported Django and Wagtail release:
#   tox                                   # every environment whose Python is installed
#   tox -e py312-django52,py312-wagtail81-django61
#   tox -e lint,build
#
# converter-studio comes from PyPI; set CONVERTER_STUDIO_CLIENT to install it from somewhere else
# (a folder, or "git+https://github.com/tariksucu/converter-studio-python").
[tox]
requires = tox>=4.20
env_list =
    py3{11,12,13,14}-django52
    py3{12,13,14}-django60
    py3{12,13,14,15}-django61
    py3{12,13}-wagtail74-django{52,60}
    py3{12,13,14}-wagtail80-django{52,60,61}
    py3{11,12}-wagtail81-django52
    py3{12,13,14,15}-wagtail81-django61
    lint
    build
skip_missing_interpreters = true

[testenv]
description = unit tests against a fake Converter Studio API (no network, no key)
deps =
    pytest>=8.3
    pytest-django>=4.9
    {env:CONVERTER_STUDIO_CLIENT:converter-studio>=1.0,<2}
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    wagtail74: wagtail>=7.4,<7.5
    wagtail80: wagtail>=8.0,<8.1
    wagtail81: wagtail>=8.1,<8.2
pass_env = PYTHONPYCACHEPREFIX
commands = pytest -p no:cacheprovider {posargs}

[testenv:lint]
description = ruff (lint and format) and mypy (strict, django-stubs)
base_python = py312
deps =
    ruff>=0.8
    mypy>=1.13
    django-stubs>=6.1
    pytest>=8.3
    pytest-django>=4.9
    {env:CONVERTER_STUDIO_CLIENT:converter-studio>=1.0,<2}
    Django>=6.1,<6.2
    wagtail>=8.1,<8.2
pass_env = RUFF_CACHE_DIR, MYPY_CACHE_DIR, PYTHONPYCACHEPREFIX
commands =
    ruff check .
    ruff format --check .
    mypy

[testenv:build]
description = build the sdist and the wheel and check them with twine
base_python = py312
skip_install = true
deps =
    build>=1.2
    twine>=6.1
commands =
    python -m build --outdir {env_tmp_dir}/dist .
    twine check --strict {env_tmp_dir}/dist/*
